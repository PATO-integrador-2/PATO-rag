# config/taxonomia.yaml

dominios:

  colombia:
    fuente: "DANE - IPM Colombia"
    resolucion: "Departamento Administrativo Nacional de Estadística"
    dimensiones:

      educacion_hogar:
        nombre: "Condiciones educativas del hogar"
        indicadores:
          - "analfabetismo"
          - "bajo logro educativo"

      ninez_juventud:
        nombre: "Condiciones de la niñez y juventud"
        indicadores:
          - "inasistencia escolar"
          - "rezago escolar"
          - "barreras de acceso a servicios de cuidado de la primera infancia"
          - "trabajo infantil"

      salud:
        nombre: "Salud"
        indicadores:
          - "sin aseguramiento en salud"
          - "barreras de acceso a salud dada una necesidad"

      trabajo:
        nombre: "Trabajo"
        indicadores:
          - "trabajo informal"
          - "desempleo de larga duración"

      vivienda_servicios:
        nombre: "Acceso a servicios públicos domiciliarios y condiciones de la vivienda"
        indicadores:
          - "sin acceso a fuente de agua mejorada"
          - "inadecuada eliminación de excretas"
          - "material inadecuado de pisos"
          - "material inadecuado de paredes exteriores"
          - "hacinamiento crítico"
  
